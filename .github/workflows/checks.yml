# Fast checks for every pull request and every push to dev: the Python tools
# compile, and every GDScript compiles in Godot (no Half-Life content needed).
name: Checks

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GODOT: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools compile
        run: python -m compileall -q tools

      - name: Get Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT}_linux.x86_64" godot

      - name: Scripts compile
        run: |
          ./godot --headless --path . --import > /dev/null 2>&1 || true
          ./godot --headless --path . res://tests/check_scripts.tscn
