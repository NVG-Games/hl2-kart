name: Idea or new track
description: Suggest a feature, a circuit, a racer, an item...
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see, and why would it be fun?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a track, the Half-Life place and what the lap would go through. Links to screenshots of the original level are welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Want to build it?
      options:
        - label: I would like to work on this myself
